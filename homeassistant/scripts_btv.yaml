      target:
        entity_id: media_player.android_tv_192_168_0_X
      data:
        command: monkey -p com.google.android.youtube.tv -c android.intent.category.LAUNCHER 1

btv_abrir_app:
  alias: 'BTV: Abrir aplicativo'
  icon: mdi:apps
  mode: single
  fields:
    pacote:
      name: Pacote Android
      required: true
      example: com.netflix.ninja
      selector:
        text:
  sequence:
    - action: androidtv.adb_command
      target:
        entity_id: media_player.android_tv_192_168_0_X
      data:
        command: "monkey -p {{ pacote | regex_replace('[^A-Za-z0-9._]','') }} -c android.intent.category.LAUNCHER 1"

btv_espelhar_tela:
  alias: 'BTV: Espelhar tela'
  icon: mdi:cast
  description: 'Acorda a caixa e abre o AirScreen (receptor de Google Cast/AirPlay). Depois transmita do PC/celular.'
  mode: single
  sequence:
    - action: androidtv.adb_command
      target:
        entity_id: media_player.android_tv_192_168_0_X
      data:
        command: input keyevent 224
    - action: androidtv.adb_command
      target:
        entity_id: media_player.android_tv_192_168_0_X
      data:
        command: monkey -p com.ionitech.airscreen -c android.intent.category.LAUNCHER 1

btv_digitar:
  alias: 'BTV: Digitar texto'
  icon: mdi:keyboard
  description: 'Digita no campo selecionado da caixa (sem acentos). Precisa do helper input_text.btv_texto_para_digitar se nao passar o campo texto.'
  mode: queued
  fields:
    texto:
      name: Texto
      required: false
      selector:
        text:
  sequence:
    - variables:
        t: >-
          {{ (texto if texto is defined and texto | length > 0 else states('input_text.btv_texto_para_digitar'))
             | regex_replace('[^A-Za-z0-9 .,@_-]','') | replace(' ','%s') }}
    - condition: template
      value_template: "{{ t | length > 0 }}"
    - action: androidtv.adb_command
      target:
        entity_id: media_player.android_tv_192_168_0_X
      data:
        command: "input text '{{ t }}'"

btv_instalar_apk:
  alias: 'BTV: Instalar APK'
  icon: mdi:android
  description: >-
    Instala um APK que ja esta no HA. Cole o caminho completo (ex.: /homeassistant/pasta/app.apk, como no File editor)
    ou so o nome (procura em /config/www/apks). A pasta precisa estar em allowlist_external_dirs.
    NAO exponha este script a voz/assistente.
  mode: single
  fields:
    arquivo:
      name: Arquivo APK
      required: true
      example: /homeassistant/www/apks/app.apk
      selector:
        text:
  sequence:
    - variables:
        caminho: >-
          {% set a = (arquivo | string | trim) %}{% if a.startswith('/homeassistant/') %}{{ '/config/' ~ a[15:] }}{% elif a.startswith('/') %}{{ a }}{% else %}{{ '/config/www/apks/' ~ a }}{% endif %}
        nome: "{{ (arquivo | string | trim).split('/')[-1] | regex_replace('[^A-Za-z0-9._-]','_') }}"
    - condition: template
      value_template: "{{ caminho.lower().endswith('.apk') and '..' not in caminho and nome | length > 4 }}"
    - action: androidtv.upload
      target:
        entity_id: media_player.android_tv_192_168_0_X
      data:
        device_path: '/sdcard/Download/{{ nome }}'
        local_path: '{{ caminho }}'
    - action: androidtv.adb_command
      target:
        entity_id: media_player.android_tv_192_168_0_X
      data:
        command: 'pm install -r /sdcard/Download/{{ nome }}'
    - action: androidtv.adb_command
      target:
        entity_id: media_player.android_tv_192_168_0_X
      data:
        command: 'rm /sdcard/Download/{{ nome }}'
    - action: persistent_notification.create
      data:
        title: 'BTV: Instalar APK'
        message: 'Pedido de instalacao de {{ nome }} enviado. O HA nao recebe o resultado: confira na lista de apps da caixa.'
