btv_volume_mais:
  alias: 'BTV: Aumentar volume'
  icon: mdi:volume-plus
  description: 'Cada toque muda 1 nivel (HDMI vai de 0 a 15). Campo passos = quantos toques.'
  mode: queued
  max: 5
  fields:
    passos:
      name: Passos
      default: 2
      selector:
        number:
          min: 1
          max: 15
  sequence:
    - variables:
        n: "{{ passos | default(2) | int }}"
    - action: androidtv.adb_command
      target:
        entity_id: media_player.android_tv_192_168_0_X
      data:
        command: "{% for i in range(n) %}sendevent /dev/input/event1 1 115 1; sendevent /dev/input/event1 0 0 0; sendevent /dev/input/event1 1 115 0; sendevent /dev/input/event1 0 0 0; {% endfor %}true"

btv_volume_menos:
