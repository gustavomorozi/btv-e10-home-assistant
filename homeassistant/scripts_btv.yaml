# Scripts de controle da BTV E10 via ADB (Home Assistant).
# Troque media_player.android_tv_192_168_0_X pela sua entidade (Android Debug Bridge).
# Cole dentro do seu scripts.yaml. O HA nao recebe a saida dos comandos.

btv_inicio:
  alias: 'BTV: Inicio'
  icon: mdi:home
  mode: single
  sequence:
    - action: androidtv.adb_command
      target:
        entity_id: media_player.android_tv_192_168_0_X
      data:
        command: "sendevent /dev/input/event1 1 102 1; sendevent /dev/input/event1 0 0 0; sendevent /dev/input/event1 1 102 0; sendevent /dev/input/event1 0 0 0"

